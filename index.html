<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Logbook Coach</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <!-- Официальный скрипт Telegram Mini Apps: даёт window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Вместо пустого белого экрана — текст ошибки: в Telegram на телефоне нет консоли,
      а так пользователь может прислать скриншот. Обычный скрипт, без новых возможностей JS,
      чтобы сработать даже там, где сам бандл не запускается.
    -->
    <script>
      (function () {
        var shown = false;
        function show(text) {
          var root = document.getElementById("root");
          if (shown || !root || root.childNodes.length) return;
          shown = true;
          root.innerHTML =
            '<div style="padding:24px 16px;font:15px/1.45 system-ui,sans-serif;color:#131a28">' +
            '<b style="display:block;font-size:17px;margin-bottom:8px">Приложение не запустилось</b>' +
            'Закройте его и откройте снова. Если не поможет — пришлите скриншот этого экрана.' +
            '<pre style="margin-top:16px;padding:12px;background:#f4f5f8;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:12px"></pre></div>';
          root.querySelector("pre").textContent = text + "\n\n" + navigator.userAgent;
        }
        // true — ловим и ошибки загрузки файлов (например, скрипт сборки отдал 404)
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window) {
            // Шрифты и стили без нужды не тревожат: без них приложение всё равно работает
            if (t.tagName === "SCRIPT") show("Не загрузился скрипт: " + t.src);
            return;
          }
          show(String(e.message || e.error));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
        setTimeout(function () { show("Приложение не отрисовалось за 10 секунд"); }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
